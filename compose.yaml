name: base-cnpj

services:
  db:
    image: postgres:16-alpine
    container_name: base-cnpj-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command:
      - postgres
      - -c
      - shared_buffers=1GB
      - -c
      - work_mem=64MB
      - -c
      - maintenance_work_mem=1GB
      - -c
      - max_wal_size=8GB
      - -c
      - checkpoint_timeout=15min
      - -c
      - synchronous_commit=off
      - -c
      - max_parallel_workers=8
      - -c
      - max_parallel_maintenance_workers=4
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${PORTA_POSTGRES:-5436}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      # depois de uma carga interrompida o redo do WAL passa de 5 min; sem esta
      # folga o banco e marcado unhealthy e todo depends_on falha junto
      start_period: 600s
    networks:
      - base-cnpj

  api:
    build: .
    image: base-cnpj-api
    container_name: base-cnpj-api
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PORTA_API:-8006}:8000"
    networks:
      - base-cnpj

  ingestor:
    build: .
    image: base-cnpj-api
    container_name: base-cnpj-ingestor
    profiles: ["manual"]
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      DATA_DIR: /data
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ${DATA_VOLUME:-dados}:/data
    entrypoint: ["python"]
    command: ["-m", "app.ingerir"]
    networks:
      - base-cnpj

volumes:
  pgdata:
  dados:

networks:
  base-cnpj:
    driver: bridge
